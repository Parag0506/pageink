<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A page with a carousel</title>
<style>
  body { font: 18px/1.6 Georgia, serif; margin: 0; padding: 24px 40px; color: #222; background: #fff; }
  #car { width: 640px; height: 260px; overflow: hidden; position: relative; border: 1px solid #ccc; touch-action: none; }
  #strip { display: flex; width: 1920px; height: 100%; }
  .slide { flex: none; width: 640px; height: 100%; padding: 24px; box-sizing: border-box; }
</style>
</head>
<body>
<h1>Carousel</h1>
<div id="car"><div id="strip">
  <div class="slide"><p>The first slide talks about a marmalade cat that sleeps all day.</p></div>
  <div class="slide"><p>The second slide.</p></div>
  <div class="slide"><p>The third slide.</p></div>
</div></div>
<p id="after">Text after the carousel about the Borrowdale pencil.</p>
<script>
  // Swipes move the strip. The page takes touches and the pointer for itself.
  const car = document.getElementById('car');
  let x0 = null;
  window.__moved = 0;
  for (const t of ['touchstart', 'touchmove']) car.addEventListener(t, (e) => e.preventDefault(), { passive: false });
  car.addEventListener('pointerdown', (e) => { x0 = e.clientX; car.setPointerCapture(e.pointerId); e.preventDefault(); });
  car.addEventListener('pointermove', (e) => { if (x0 !== null) window.__moved++; });
  car.addEventListener('pointerup', () => { x0 = null; });
</script>
</body>
</html>
