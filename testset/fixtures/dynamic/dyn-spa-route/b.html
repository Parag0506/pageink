<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guide</title><style>
:root { color-scheme: light dark; --fg: #1d1d1f; --bg: #fdfcf9; --muted: #666; --rule: #ccc; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 18px/1.6 Georgia, 'Times New Roman', serif; }
header.site { padding: 12px 24px; border-bottom: 1px solid var(--rule); font: 14px/1.4 system-ui, sans-serif; }
main.article { max-width: 680px; margin: 0 auto; padding: 24px 24px 120px; }
h1 { font-size: 2.1rem; line-height: 1.2; margin: 0.4em 0; }
h2 { font-size: 1.45rem; margin: 1.6em 0 0.5em; }
p { margin: 0 0 1em; }
figure { margin: 1.4em 0; }
figure img { display: block; width: 100%; height: auto; }
figcaption { font-size: 0.85rem; color: var(--muted); margin-top: 0.4em; }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; margin: 1.4em 0; }
caption { text-align: left; font-size: 0.85rem; color: var(--muted); padding-bottom: 0.4em; }
td, th { border: 1px solid var(--rule); padding: 4px 8px; text-align: left; }
blockquote { margin: 1.2em 0; padding-left: 1em; border-left: 3px solid var(--rule); font-style: italic; }
aside.summary { border: 1px solid var(--rule); padding: 8px 16px; margin: 1em 0; font-size: 0.95rem; }
@media (max-width: 500px) { body { font-size: 16px; } main.article { padding: 12px 16px 80px; } }
 article h2 { font-size: 1.2rem; }</style></head>
<body><header class="site">Ink test set, page app</header>
<main class="article" id="app"></main>
<script>
(function () {
  var routes = { '#/guide': [{"h":"Origins of the coastal light","p":"Long before engineers drew plans for stone towers, fishing villages kept a fire burning on the highest rock above the harbour. A boy or an old sailor fed the flames through the night, and boats returning late steered by the glow. The custom was practical rather than grand, and most of these early beacons left no trace beyond a blackened patch of ground."},{"h":"Origins of the coastal light","p":"The first purpose-built towers appeared where trade routes crowded into narrow channels. Merchants paid a small toll for each cargo that passed, and the money bought timber, coal and the wages of a keeper. Records from several ports show that the toll was resented in good years and gladly paid after a winter of wrecks."},{"h":"Origins of the coastal light","p":"Coal fires gave way to oil lamps once glass could be made clear enough to shelter a flame from the wind. An oil lamp burned more steadily and needed less tending, which allowed one keeper to manage a light alone. The change also moved the flame indoors, behind panes that salt spray quickly dulled."},{"h":"Lenses and reflectors","p":"A bare flame sends light in every direction, and most of it is wasted on the sky and the land behind the tower. Polished metal reflectors were the first answer. A curved dish placed behind each lamp gathered the stray light and threw it out toward the sea in a tighter beam."},{"h":"Lenses and reflectors","p":"The stepped lens changed everything. By cutting a large lens into rings of glass, each ring bending light by the right amount, makers produced an optic that was thin, light and remarkably bright. A single lamp behind such a lens could be seen from distances that had needed a dozen lamps before."},{"h":"Lenses and reflectors","p":"Lenses were graded by size into orders, the largest standing taller than a person and weighing several tonnes. Smaller orders served harbour entrances and river mouths, where a ship needed to see the light only for the last few miles of its approach."},{"h":"The life of a keeper","p":"Keeping a light was steady, lonely work. The lamp had to be lit at sunset and put out at dawn, the wick trimmed through the night, and the glass cleaned every morning. Many keepers wrote a short entry in the log at each change of watch, noting the wind, the sea and any vessel in sight."},{"h":"The life of a keeper","p":"Families often lived at the station, and children learned to read the weather before they learned their letters. Supplies came by boat when the sea allowed, which on exposed rocks could mean weeks of waiting. Stations on the mainland were easier, with a garden, a cow and neighbours within a day of walking."},{"h":"Automation and the end of the keepers","p":"Electric lamps arrived at the larger stations first, followed by switches that turned the light on when daylight faded. Each improvement removed one of the duties in the keeper list, and by the middle of the last century a single technician could look after several lights from a shore base."},{"h":"Automation and the end of the keepers","p":"The last resident keepers left their towers within living memory. Some stations were sold as houses or turned into small museums, while others stand empty with only a modern lamp on the gallery. Ships now carry satellite receivers, yet many captains still say that nothing reassures like a familiar light coming over the horizon."},{"h":"Automation and the end of the keepers","p":"Preservation groups now raise money to repaint towers and repair lens rooms. Their volunteers guide visitors up the spiral stairs and explain how the clockwork once turned a tonne of glass with a weight no heavier than a bucket of sand."}], '#/news': [{"h":"Entry 101: jetty orchard","p":"Notes on the moor near the fern, recorded after the yarrow season, with a remark about the nook and the pier along the tarn shore (item 101)."},{"h":"Entry 102: cove fjord","p":"Notes on the upland near the willow, recorded after the glen season, with a remark about the sedge and the reed along the sedge shore (item 102)."},{"h":"Entry 103: juniper knoll","p":"Notes on the isle near the reed, recorded after the bramble season, with a remark about the fjord and the knoll along the granite shore (item 103)."},{"h":"Entry 104: tide estuary","p":"Notes on the sedge near the basin, recorded after the harbour season, with a remark about the lagoon and the marsh along the cedar shore (item 104)."},{"h":"Entry 105: fjord rill","p":"Notes on the nettle near the knoll, recorded after the glen season, with a remark about the lagoon and the reed along the kelp shore (item 105)."},{"h":"Entry 106: oak cedar","p":"Notes on the rill near the quarry, recorded after the dune season, with a remark about the estuary and the isle along the vale shore (item 106)."},{"h":"Entry 107: isle inlet","p":"Notes on the yarrow near the nettle, recorded after the delta season, with a remark about the heath and the amber along the zephyr shore (item 107)."},{"h":"Entry 108: lagoon reed","p":"Notes on the amber near the pier, recorded after the nook season, with a remark about the lagoon and the delta along the zephyr shore (item 108)."},{"h":"Entry 109: knoll kelp","p":"Notes on the nettle near the sedge, recorded after the glen season, with a remark about the weir and the oak along the willow shore (item 109)."},{"h":"Entry 110: isle tide","p":"Notes on the alder near the orchard, recorded after the ledge season, with a remark about the sedge and the isle along the estuary shore (item 110)."},{"h":"Entry 111: oak jetty","p":"Notes on the fjord near the weir, recorded after the tide season, with a remark about the jetty and the ember along the lagoon shore (item 111)."}] };
  var pool = [];
  var root = document.getElementById('app');
  function render() {
    var data = routes[location.hash] || routes['#/guide'];
    if (location.hash === '#/news') data = data.slice().reverse();
    while (pool.length < data.length) {
      var a = document.createElement('article');
      a.append(document.createElement('h2'), document.createElement('p'));
      root.appendChild(a); pool.push(a);
    }
    // Recycle nodes in a rotated order so paths point at different content.
    var shift = location.hash === '#/news' ? 3 : 0;
    data.forEach(function (d, i) {
      var a = pool[(i + shift) % pool.length];
      a.firstChild.textContent = d.h; a.lastChild.textContent = d.p;
      root.appendChild(a);
    });
    document.title = location.hash === '#/news' ? 'News' : 'Guide';
  }
  addEventListener('hashchange', render);
  if (!location.hash) history.replaceState(null, '', '#/news');
  render();
  window.__inkSettle = async function () {
    location.hash = '#/guide';
    await new Promise(function (r) { setTimeout(r, 50); });
    window.__inkSettled = true;
  };
})();
</script>
</body></html>
