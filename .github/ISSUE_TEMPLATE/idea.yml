name: Idea
description: Suggest a change or a new feature.
labels: [idea]
body:
  - type: textarea
    id: need
    attributes:
      label: What you want to do
      description: The task you are trying to get done, and where PageInk gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How it could work. Sketches are welcome.
  - type: textarea
    id: more
    attributes:
      label: Anything else
