name: Pages

# The home page and the privacy page in site/, published with GitHub Pages. The privacy page is
# made from PRIVACY.md. The build uses no packages, so nothing is installed.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "PRIVACY.md"
      - "brand/**"
      - "docs/media/**"
      - ".github/workflows/pages.yml"
      # The build also reads the product name and the copyright line.
      - "packages/core/src/brand.ts"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time. A publish that has started is left to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build the site and publish it
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Stops here, with the line named, if PRIVACY.md uses Markdown the converter does not know.
      - name: Build the site
        run: node site/build.mjs "$RUNNER_TEMP/site"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

      - name: Publish
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
