name: Pages

# The pages in site/, published with GitHub Pages. The privacy page is made from PRIVACY.md, and
# the guides say which version of the extension they describe. The build uses no packages, so
# nothing is installed.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "PRIVACY.md"
      - "brand/**"
      - "docs/media/**"
      - "packages/extension/package.json"
      - ".github/workflows/pages.yml"
      # The build also reads the product name and the copyright line.
      - "packages/core/src/brand.ts"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time. A publish that has started is left to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build the site and publish it
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.first.outputs.page_url || steps.second.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Stops here, with the line named, if PRIVACY.md uses Markdown the converter does not know.
      - name: Build the site
        run: node site/build.mjs "$RUNNER_TEMP/site"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

      # GitHub sometimes does not list the upload yet when the publish step asks for it, and the
      # step then fails with "No artifacts named github-pages". So a failed publish is tried once
      # more after a wait, and the run fails only when the second try fails too.
      - name: Publish
        id: first
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Wait before the second try
        if: steps.first.outcome == 'failure'
        run: sleep 45

      - name: Publish, second try
        id: second
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
